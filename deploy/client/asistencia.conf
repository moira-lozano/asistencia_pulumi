server {
    listen 80;
    server_name _;
    root /var/www/asistencia;
    index index.html;
    server_tokens off;
    client_max_body_size 4m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
    # expires añade Cache-Control sin anular las cabeceras heredadas.
    expires -1;

    location /api/ {
        # Sin barra final: conservar /api al reenviar.
        # Sustituir por la IP privada real del servidor backend.
        proxy_pass http://192.168.1.30:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 120s;
    }

    location = / { try_files /index.html =404; }
    location = /index.html { try_files $uri =404; }
    location = /app.js { try_files $uri =404; }
    location = /styles.css { try_files $uri =404; }
    location = /config.js { try_files $uri =404; }
    location / { return 404; }
}
