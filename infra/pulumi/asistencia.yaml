AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Academic deployment of UAGRM attendance: public frontend and backend EC2
  instances in a single public subnet, matching the OpenTofu AWS layout.

Parameters:
  InstanceType:
    Type: String
    Default: t3.micro
    Description: EC2 instance type for both application servers.

  SshIngressCidr:
    Type: String
    Description: IPv4 CIDR allowed to SSH to the instances, for example 203.0.113.10/32.
    AllowedPattern: ^([0-9]{1,3}\.){3}[0-9]{1,3}/([0-9]|[1-2][0-9]|3[0-2])$
    ConstraintDescription: Enter an IPv4 CIDR with a prefix between /0 and /32.

  ApiIngressCidr:
    Type: String
    Default: 0.0.0.0/0
    Description: IPv4 CIDR allowed to reach the API on port 3000.
    AllowedPattern: ^([0-9]{1,3}\.){3}[0-9]{1,3}/([0-9]|[1-2][0-9]|3[0-2])$
    ConstraintDescription: Enter an IPv4 CIDR with a prefix between /0 and /32.

  KeyPairName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: Existing EC2 key pair name. Keep its private key secure.

  UbuntuAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/canonical/ubuntu/server/24.04/stable/current/amd64/hvm/ebs-gp3/ami-id
    Description: Public Canonical SSM parameter for the latest Ubuntu 24.04 LTS amd64 gp3 AMI.

Resources:
  AttendanceVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.24.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: asistencia-vpc
        - Key: Project
          Value: uagrm-asistencia
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Environment
          Value: academic-demo

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref AttendanceVpc
      CidrBlock: 10.24.1.0/24
      AvailabilityZone: !Select
        - 0
        - !GetAZs ""
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: asistencia-public-subnet
        - Key: Project
          Value: uagrm-asistencia
        - Key: ManagedBy
          Value: CloudFormation

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: asistencia-igw
        - Key: Project
          Value: uagrm-asistencia
        - Key: ManagedBy
          Value: CloudFormation

  VpcGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref AttendanceVpc
      InternetGatewayId: !Ref InternetGateway

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref AttendanceVpc
      Tags:
        - Key: Name
          Value: asistencia-public-routes
        - Key: Project
          Value: uagrm-asistencia
        - Key: ManagedBy
          Value: CloudFormation

  DefaultPublicRoute:
    Type: AWS::EC2::Route
    DependsOn: VpcGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  FrontendSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Public frontend web access and restricted SSH.
      VpcId: !Ref AttendanceVpc
      SecurityGroupIngress:
        - Description: Frontend web client
          IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          CidrIp: 0.0.0.0/0
        - Description: SSH from configured operator network
          IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref SshIngressCidr
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: asistencia-frontend-sg
        - Key: Project
          Value: uagrm-asistencia
        - Key: ManagedBy
          Value: CloudFormation

  BackendSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Public API access and restricted SSH; MySQL remains private.
      VpcId: !Ref AttendanceVpc
      SecurityGroupIngress:
        - Description: Browser clients call the API directly
          IpProtocol: tcp
          FromPort: 3000
          ToPort: 3000
          CidrIp: !Ref ApiIngressCidr
        - Description: SSH from configured operator network
          IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref SshIngressCidr
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: asistencia-backend-sg
        - Key: Project
          Value: uagrm-asistencia
        - Key: ManagedBy
          Value: CloudFormation

  FrontendInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref UbuntuAmiId
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyPairName
      NetworkInterfaces:
        - AssociatePublicIpAddress: true
          DeviceIndex: "0"
          GroupSet:
            - !Ref FrontendSecurityGroup
          SubnetId: !Ref PublicSubnet
      MetadataOptions:
        HttpEndpoint: enabled
        HttpTokens: required
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: 12
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
      Tags:
        - Key: Name
          Value: asistencia-frontend
        - Key: Project
          Value: uagrm-asistencia
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Environment
          Value: academic-demo

  BackendInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref UbuntuAmiId
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyPairName
      NetworkInterfaces:
        - AssociatePublicIpAddress: true
          DeviceIndex: "0"
          GroupSet:
            - !Ref BackendSecurityGroup
          SubnetId: !Ref PublicSubnet
      MetadataOptions:
        HttpEndpoint: enabled
        HttpTokens: required
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: 12
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
      Tags:
        - Key: Name
          Value: asistencia-backend
        - Key: Project
          Value: uagrm-asistencia
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Environment
          Value: academic-demo

Outputs:
  FrontendUrl:
    Description: Open this URL after starting the frontend application on the instance.
    Value: !Sub http://${FrontendInstance.PublicIp}:8080

  BackendApiUrl:
    Description: Configure this URL as API_BASE_URL for the frontend application.
    Value: !Sub http://${BackendInstance.PublicIp}:3000

  FrontendPublicIp:
    Description: Public IPv4 address of the frontend instance.
    Value: !GetAtt FrontendInstance.PublicIp

  BackendPublicIp:
    Description: Public IPv4 address of the backend instance.
    Value: !GetAtt BackendInstance.PublicIp

  BackendPrivateIp:
    Description: Private IPv4 address of the backend instance.
    Value: !GetAtt BackendInstance.PrivateIp

  FrontendSsh:
    Description: SSH command; replace the private key file path with your local path.
    Value: !Sub ssh -i asistencia-aws.pem ubuntu@${FrontendInstance.PublicIp}

  BackendSsh:
    Description: SSH command; replace the private key file path with your local path.
    Value: !Sub ssh -i asistencia-aws.pem ubuntu@${BackendInstance.PublicIp}
