
AWSTemplateFormatVersion: '2010-09-09'
Description: Grupos de seguridad de asistencia

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: ID de la VPC donde se crearán los grupos de seguridad

  SshCidr:
    Type: String
    Description: IP autorizada para SSH en formato CIDR, por ejemplo 203.0.113.10/32
    AllowedPattern: '^([0-9]{1,3}\.){3}[0-9]{1,3}/32$'

Resources:
  FrontendSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Acceso web al frontend
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref SshCidr
      Tags:
        - Key: Name
          Value: asistencia-frontend-sg

  BackendSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Acceso al backend desde el frontend
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8090
          ToPort: 8090
          SourceSecurityGroupId: !Ref FrontendSecurityGroup
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref SshCidr
      Tags:
        - Key: Name
          Value: asistencia-backend-sg

Outputs:
  FrontendSecurityGroupId:
    Value: !Ref FrontendSecurityGroup

  BackendSecurityGroupId:
    Value: !Ref BackendSecurityGroup
